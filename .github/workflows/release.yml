name: Android Test Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure Rust for F-Droid style build
        run: |
          cd rust
          cargo vendor vendor
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"

          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"

          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"

          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"

          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK - ARM64
        run: ./gradlew assembleDebug -PrustTargets=arm64

      - name: Show generated APKs
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Supertonic-Fixed-Test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
