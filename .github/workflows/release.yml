name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure Rust for vendored build
        run: |
          cd rust
          cargo vendor vendor
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"

          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"

          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"

          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"

          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare signing config (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "has_signing=true"
              echo "store_file=$RUNNER_TEMP/release.keystore"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release outputs
        if: steps.signing.outputs.has_signing == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING_PASS_KEY=password
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Pandroid.injected.signing.store.file="${{ steps.signing.outputs.store_file }}" \
            "-Pandroid.injected.signing.store.${SIGNING_PASS_KEY}=$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.${SIGNING_PASS_KEY}=$ANDROID_KEY_PASSWORD"

      - name: Build unsigned release outputs
        if: steps.signing.outputs.has_signing != 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Prepare MonsunAI artifacts
        run: |
          mkdir -p release-artifacts
          APK_SRC="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB_SRC="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          cp "$APK_SRC" release-artifacts/MonsunAI.apk
          cp "$AAB_SRC" release-artifacts/MonsunAI.aab
          ls -lh release-artifacts

      - name: Upload MonsunAI APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MonsunAI-release
          path: |
            release-artifacts/MonsunAI.apk
            release-artifacts/MonsunAI.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach MonsunAI files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/MonsunAI.apk
            release-artifacts/MonsunAI.aab
          generate_release_notes: true

      - name: Signing note
        run: |
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            echo "Built with release signing secrets."
          else
            echo "Signing secrets not available; produced valid unsigned release outputs."
          fi
